<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MF-Tyre 6.2 Curve Explorer</title>
<style>
  :root {
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }
  header h1 { font-size: 20px; margin: 0 0 2px; }
  header p  { margin: 0 0 16px; color: var(--text-secondary); font-size: 13px; }

  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  /* ---- controls ---- */
  .controls label.field { display: block; margin-bottom: 12px; }
  .controls .lab {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); margin-bottom: 4px;
  }
  .controls select, .controls input[type="number"] {
    width: 100%; padding: 6px 8px; font: inherit;
    color: var(--text-primary); background: var(--page);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .controls fieldset {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px 2px; margin: 0 0 12px;
  }
  .controls legend { font-size: 12px; font-weight: 600; color: var(--text-secondary); padding: 0 4px; }
  .fixedrow { display: grid; grid-template-columns: 1fr 96px 34px; gap: 6px; align-items: center; margin-bottom: 8px; }
  .fixedrow .name { font-size: 13px; color: var(--text-primary); }
  .fixedrow .unit { font-size: 12px; color: var(--text-muted); }
  .rangerow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .rangerow .lab { margin-bottom: 2px; }
  .check { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .check input { accent-color: var(--series-1); }

  /* ---- chart card ---- */
  .chart-title { font-size: 15px; font-weight: 650; margin: 0 0 2px; }
  .chart-sub   { font-size: 12px; color: var(--text-secondary); margin: 0 0 10px; }
  .chart-box { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: inherit; font-size: 11px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
  svg .axis-name { font-size: 12px; fill: var(--text-secondary); font-weight: 600; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .zeroline { stroke: var(--baseline); stroke-width: 1; }
  .axisline { stroke: var(--baseline); stroke-width: 1; }
  .series   { stroke: var(--series-1); stroke-width: 2; fill: none;
              stroke-linejoin: round; stroke-linecap: round; }
  .crosshair { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 3; }
  .hoverdot  { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }

  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 5;
  }
  .tooltip .val { font-weight: 700; font-size: 14px; color: var(--text-primary);
                  display: flex; align-items: center; gap: 6px; }
  .tooltip .val .key { width: 14px; height: 0; border-top: 2px solid var(--series-1); display: inline-block; }
  .tooltip .at  { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .note { font-size: 12px; color: var(--text-secondary); margin: 10px 0 0; }
  .note:empty { display: none; }
  .error { color: #d03b3b; }

  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 13px; color: var(--text-secondary); }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 14px 3px 0; font-size: 12px; }
  th { color: var(--text-secondary); border-bottom: 1px solid var(--grid); }
  td { color: var(--text-primary); }
  .tablebox { max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MF-Tyre 6.2 Curve Explorer</h1>
    <p id="tireinfo">Loading tire data&hellip;</p>
  </header>

  <div class="layout">
    <div class="card controls">
      <label class="field">
        <span class="lab">Sweep this input</span>
        <select id="swept"></select>
      </label>
      <label class="field">
        <span class="lab">Plot this output</span>
        <select id="output"></select>
      </label>
      <label class="check">
        <input type="checkbox" id="swap">
        <span>Put the output on the X axis</span>
      </label>

      <fieldset>
        <legend>Fixed inputs</legend>
        <div id="fixedbox"></div>
      </fieldset>

      <fieldset>
        <legend>Sweep range</legend>
        <div class="rangerow">
          <label><span class="lab">Min</span><input type="number" id="rmin" step="any"></label>
          <label><span class="lab">Max</span><input type="number" id="rmax" step="any"></label>
          <label><span class="lab">Points</span><input type="number" id="rpts" min="2" max="2000" step="1" value="300"></label>
        </div>
      </fieldset>
    </div>

    <div class="card">
      <h2 class="chart-title" id="ctitle">&nbsp;</h2>
      <p class="chart-sub" id="csub">&nbsp;</p>
      <div class="chart-box" id="chartbox">
        <svg id="chart" viewBox="0 0 800 460" role="img" aria-label="Tire curve"></svg>
        <div class="tooltip" id="tooltip">
          <div class="val"><span class="key"></span><span id="tt-y"></span></div>
          <div class="at" id="tt-x"></div>
        </div>
      </div>
      <p class="note" id="note"></p>
      <details>
        <summary>Data table</summary>
        <div class="tablebox">
          <table>
            <thead><tr><th id="th-x"></th><th id="th-y"></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </details>
    </div>
  </div>
</div>

<script>
"use strict";

const INPUTS = {
  pressure: { label: "Tire pressure", unit: "psi", fixed: 14.5, sweep: [8, 20] },
  fz:       { label: "FZ (vertical load)", unit: "N", fixed: 667, sweep: [100, 1500] },
  sa:       { label: "Slip angle", unit: "deg", fixed: 0, sweep: [-12, 12] },
  sr:       { label: "Slip ratio", unit: "", fixed: 0, sweep: [-0.2, 0.2] },
  camber:   { label: "Camber", unit: "deg", fixed: 0, sweep: [-4, 4] },
};
const OUTPUTS = {
  fx: { label: "FX (longitudinal force)", unit: "N" },
  fy: { label: "FY (lateral force)", unit: "N" },
  mx: { label: "MX (overturning moment)", unit: "N·m" },
  my: { label: "MY (rolling resistance moment)", unit: "N·m" },
  mz: { label: "MZ (aligning moment)", unit: "N·m" },
};

const $ = id => document.getElementById(id);
const state = {
  swept: "sa", output: "fy", swap: false,
  fixed: Object.fromEntries(Object.entries(INPUTS).map(([k, v]) => [k, v.fixed])),
  min: INPUTS.sa.sweep[0], max: INPUTS.sa.sweep[1], points: 300,
  data: null, info: null,
};

function fmt(v, digits = 4) {
  if (v === null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(2);
  return Number(v.toPrecision(digits)).toLocaleString("en-US", { maximumFractionDigits: 6 });
}
function withUnit(v, unit) { return unit ? `${fmt(v)} ${unit}` : fmt(v); }

/* ---------- controls ---------- */
function fillSelect(sel, dict, current) {
  sel.replaceChildren();
  for (const [key, meta] of Object.entries(dict)) {
    const o = document.createElement("option");
    o.value = key;
    o.textContent = meta.unit ? `${meta.label} [${meta.unit}]` : meta.label;
    sel.appendChild(o);
  }
  sel.value = current;
}

function renderFixedInputs() {
  const box = $("fixedbox");
  box.replaceChildren();
  for (const [key, meta] of Object.entries(INPUTS)) {
    if (key === state.swept) continue;
    const row = document.createElement("div");
    row.className = "fixedrow";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = meta.label;
    const inp = document.createElement("input");
    inp.type = "number"; inp.step = "any"; inp.value = state.fixed[key];
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      if (isFinite(v)) { state.fixed[key] = v; refresh(); }
    });
    const unit = document.createElement("span");
    unit.className = "unit";
    unit.textContent = meta.unit || "–";
    row.append(name, inp, unit);
    box.appendChild(row);
  }
}

function onSweptChanged() {
  state.swept = $("swept").value;
  const [lo, hi] = INPUTS[state.swept].sweep;
  state.min = lo; state.max = hi;
  $("rmin").value = lo; $("rmax").value = hi;
  renderFixedInputs();
  refresh();
}

/* ---------- data ---------- */
let debounceTimer = null;
function refresh() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(fetchSweep, 120);
}

async function fetchSweep() {
  const body = {
    swept: state.swept, output: state.output,
    min: state.min, max: state.max, points: state.points,
    fixed: state.fixed,
  };
  try {
    const res = await fetch("/api/sweep", { method: "POST", body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    state.data = data;
    setNote();
    render();
  } catch (err) {
    const note = $("note");
    note.className = "note error";
    note.textContent = "Could not compute sweep: " + err.message;
  }
}

function setNote() {
  const note = $("note");
  note.className = "note";
  note.textContent =
    (state.output === "my" && state.info && state.info.my_all_zero)
      ? "All rolling-resistance coefficients (QSY1–QSY8) in this .tir are zero, so MY is identically 0."
      : "";
}

/* ---------- chart ---------- */
const SVG_NS = "http://www.w3.org/2000/svg";
const W = 800, H = 460, M = { top: 14, right: 20, bottom: 48, left: 70 };
function el(name, attrs, cls) {
  const e = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (cls) e.setAttribute("class", cls);
  return e;
}
function niceTicks(lo, hi, n = 6) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const ticks = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + step * 1e-9; t += step)
    ticks.push(Math.abs(t) < step * 1e-9 ? 0 : t);
  return ticks;
}

let plotCache = null; // {xs, ys, xScale, yScale, xMeta, yMeta}

function render() {
  if (!state.data) return;
  const inMeta = INPUTS[state.swept], outMeta = OUTPUTS[state.output];
  const xMeta = state.swap ? outMeta : inMeta;
  const yMeta = state.swap ? inMeta : outMeta;
  const xs = state.swap ? state.data.y : state.data.x;
  const ys = state.swap ? state.data.x : state.data.y;

  // titles
  $("ctitle").textContent = `${outMeta.label} vs ${inMeta.label}`;
  const fixedDesc = Object.entries(INPUTS)
    .filter(([k]) => k !== state.swept)
    .map(([k, m]) => `${m.label.split(" (")[0]} = ${withUnit(state.fixed[k], m.unit)}`)
    .join(", ");
  $("csub").textContent = `${fixedDesc} — ${state.info ? state.info.file : ""}`;

  // extents (pad y 5%)
  const fx = xs.filter(v => v !== null), fy = ys.filter(v => v !== null);
  let x0 = Math.min(...fx), x1 = Math.max(...fx);
  let y0 = Math.min(...fy), y1 = Math.max(...fy);
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  const pad = (y1 - y0 || 2) * 0.05;
  y0 -= pad; y1 += pad;

  const xScale = v => M.left + (v - x0) / (x1 - x0) * (W - M.left - M.right);
  const yScale = v => H - M.bottom - (v - y0) / (y1 - y0) * (H - M.top - M.bottom);

  const svg = $("chart");
  svg.replaceChildren();

  // grid + ticks
  for (const t of niceTicks(y0, y1)) {
    const y = yScale(t);
    svg.appendChild(el("line", { x1: M.left, x2: W - M.right, y1: y, y2: y },
      t === 0 ? "zeroline" : "gridline"));
    const lab = el("text", { x: M.left - 8, y: y + 3.5, "text-anchor": "end" });
    lab.textContent = fmt(t, 3);
    svg.appendChild(lab);
  }
  for (const t of niceTicks(x0, x1, 8)) {
    const x = xScale(t);
    if (t === 0) svg.appendChild(el("line", { x1: x, x2: x, y1: M.top, y2: H - M.bottom }, "zeroline"));
    svg.appendChild(el("line", { x1: x, x2: x, y1: H - M.bottom, y2: H - M.bottom + 4 }, "axisline"));
    const lab = el("text", { x: x, y: H - M.bottom + 16, "text-anchor": "middle" });
    lab.textContent = fmt(t, 3);
    svg.appendChild(lab);
  }
  svg.appendChild(el("line", { x1: M.left, x2: W - M.right, y1: H - M.bottom, y2: H - M.bottom }, "axisline"));

  // axis names
  const xn = el("text", { x: (M.left + W - M.right) / 2, y: H - 10, "text-anchor": "middle" }, "axis-name");
  xn.textContent = xMeta.unit ? `${xMeta.label} [${xMeta.unit}]` : xMeta.label;
  svg.appendChild(xn);
  const yn = el("text", {
    x: 16, y: (M.top + H - M.bottom) / 2, "text-anchor": "middle",
    transform: `rotate(-90 16 ${(M.top + H - M.bottom) / 2})`,
  }, "axis-name");
  yn.textContent = yMeta.unit ? `${yMeta.label} [${yMeta.unit}]` : yMeta.label;
  svg.appendChild(yn);

  // series path
  let d = "", pen = false;
  for (let i = 0; i < xs.length; i++) {
    if (xs[i] === null || ys[i] === null) { pen = false; continue; }
    d += (pen ? "L" : "M") + xScale(xs[i]).toFixed(2) + " " + yScale(ys[i]).toFixed(2);
    pen = true;
  }
  svg.appendChild(el("path", { d }, "series"));

  // hover layer
  const cross = el("line", { x1: 0, x2: 0, y1: M.top, y2: H - M.bottom, visibility: "hidden" }, "crosshair");
  const dot = el("circle", { r: 4.5, visibility: "hidden" }, "hoverdot");
  svg.append(cross, dot);

  plotCache = { xs, ys, xScale, yScale, xMeta, yMeta, cross, dot };
  renderTable(xs, ys, xMeta, yMeta);
}

function renderTable(xs, ys, xMeta, yMeta) {
  $("th-x").textContent = xMeta.unit ? `${xMeta.label} [${xMeta.unit}]` : xMeta.label;
  $("th-y").textContent = yMeta.unit ? `${yMeta.label} [${yMeta.unit}]` : yMeta.label;
  const tbody = $("tbody");
  tbody.replaceChildren();
  const frag = document.createDocumentFragment();
  for (let i = 0; i < xs.length; i++) {
    const tr = document.createElement("tr");
    const a = document.createElement("td"), b = document.createElement("td");
    a.textContent = fmt(xs[i]); b.textContent = fmt(ys[i]);
    tr.append(a, b);
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

/* crosshair + tooltip: nearest point by pointer x */
const svgEl = $("chart"), tip = $("tooltip"), box = $("chartbox");
function svgPoint(evt) {
  const r = svgEl.getBoundingClientRect();
  return { px: (evt.clientX - r.left) * W / r.width, rect: r };
}
svgEl.addEventListener("pointermove", evt => {
  if (!plotCache) return;
  const { xs, ys, xScale, yScale, xMeta, yMeta, cross, dot } = plotCache;
  const { px, rect } = svgPoint(evt);
  let best = -1, bestDist = Infinity;
  for (let i = 0; i < xs.length; i++) {
    if (xs[i] === null || ys[i] === null) continue;
    const d = Math.abs(xScale(xs[i]) - px);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  if (best < 0) return;
  const cx = xScale(xs[best]), cy = yScale(ys[best]);
  cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
  cross.setAttribute("visibility", "visible");
  dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
  dot.setAttribute("visibility", "visible");

  $("tt-y").textContent = withUnit(ys[best], yMeta.unit);
  $("tt-x").textContent = `${xMeta.label.split(" (")[0]} ${withUnit(xs[best], xMeta.unit)}`;
  tip.style.display = "block";
  const bx = box.getBoundingClientRect();
  const pxCss = cx * rect.width / W + (rect.left - bx.left);
  const pyCss = cy * rect.height / H + (rect.top - bx.top);
  const flip = pxCss > bx.width - 170;
  tip.style.left = flip ? (pxCss - tip.offsetWidth - 12) + "px" : (pxCss + 12) + "px";
  tip.style.top = Math.max(0, pyCss - tip.offsetHeight - 8) + "px";
});
svgEl.addEventListener("pointerleave", () => {
  tip.style.display = "none";
  if (plotCache) {
    plotCache.cross.setAttribute("visibility", "hidden");
    plotCache.dot.setAttribute("visibility", "hidden");
  }
});

/* ---------- boot ---------- */
fillSelect($("swept"), INPUTS, state.swept);
fillSelect($("output"), OUTPUTS, state.output);
renderFixedInputs();
$("rmin").value = state.min; $("rmax").value = state.max;

$("swept").addEventListener("change", onSweptChanged);
$("output").addEventListener("change", () => { state.output = $("output").value; setNote(); refresh(); });
$("swap").addEventListener("change", () => { state.swap = $("swap").checked; render(); });
for (const [id, key] of [["rmin", "min"], ["rmax", "max"], ["rpts", "points"]]) {
  $(id).addEventListener("input", () => {
    const v = parseFloat($(id).value);
    if (isFinite(v)) { state[key] = key === "points" ? Math.round(v) : v; refresh(); }
  });
}

fetch("/api/info").then(r => r.json()).then(info => {
  state.info = info;
  $("tireinfo").textContent =
    `${info.file} — nominal load ${fmt(info.fnomin_n)} N, ` +
    `nominal pressure ${fmt(info.nompres_psi)} psi, unloaded radius ${fmt(info.r0_m)} m`;
  setNote();
  render();
});
fetchSweep();
</script>
</body>
</html>
